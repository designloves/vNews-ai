<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vertical News</title>
<meta name="description" content="A daily brief of AI, bearing and automotive news for people who build digital products and vehicles.">
<meta property="og:title" content="Vertical News">
<meta property="og:description" content="A daily brief of AI, bearing and automotive news.">
<meta name="theme-color" content="#eeeadf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="apple-mobile-web-app-title" content="Vertical News">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Archivo+Narrow:wght@500;600&family=UnifrakturMaguntia&display=swap">
<style>
/* One newspaper front page per day: dated masthead, single reading column. Arrows, keys or swipe turn to older/newer editions. */
:root{
  --paper:#eeeadf; --paper-2:#e5e0d3; --ink:#2f2d28; --ink-2:#625e55; --rule:#cdc6b6; --link:#3f5a70;
  --f-serif:"Newsreader","Iowan Old Style",Georgia,"Times New Roman",serif;
  --f-label:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#1f1e1b; --paper-2:#292824; --ink:#d6d1c4; --ink-2:#9b958a; --rule:#3b3933; --link:#a3b8c8; color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-serif);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}
.paper{max-width:680px;margin:0 auto}
.label{font-family:var(--f-label);font-weight:500;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}

/* Masthead */
.dateline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px;border-bottom:1px solid var(--rule)}
.dateline .when{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-align:center;flex:1;min-width:0}
.nav{background:none;border:1px solid transparent;border-radius:6px;padding:8px 8px;cursor:pointer;font-family:var(--f-label);font-size:13px;letter-spacing:.04em;color:var(--ink-2);white-space:nowrap}
.nav:hover:not(:disabled){background:var(--paper-2);color:var(--ink)}
.nav:disabled{opacity:.35;cursor:default}
.mast{text-align:center;padding-block:14px 10px;border-bottom:3px double var(--rule)}
.nameplate{margin:0;font-family:"UnifrakturMaguntia","Old English Text MT",var(--f-serif);font-weight:400;font-size:clamp(38px,10.5vw,72px);line-height:1}
.mast .sub{margin-top:8px}

/* Edition */
#edition{touch-action:pan-y;min-height:50vh}
.edition{display:flex;flex-direction:column;gap:26px;padding-top:20px}
/* Page turn: a snapshot of the visible page is cut into vertical strips chained in 3D, so the sheet curls as it
   turns around the screen edge; the real, already-updated page waits underneath. */
.flip-stage{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.flip-under{position:absolute;inset:0;opacity:0}
.flip-stage.fwd .flip-under{background:linear-gradient(to left,rgba(0,0,0,.55),rgba(0,0,0,.22) 45%,rgba(0,0,0,.05))}
.flip-stage.back .flip-under{background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,.22) 45%,rgba(0,0,0,.05))}
.flip-strip{position:absolute;top:0;height:100%;transform-style:preserve-3d}
.flip-face{position:absolute;top:0;height:100%;width:calc(100% + 1.5px);overflow:hidden;background:var(--paper);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip-stage.back .flip-face{right:0}
.flip-back{transform:rotateY(180deg);background:var(--paper-2)}
.flip-shade,.flip-gloss{position:absolute;inset:0;opacity:0}
.flip-shade{background:#000}
.flip-gloss{background:#fff;mix-blend-mode:soft-light}
.flip-clone{position:absolute;margin:0}

/* Live tuning panel (open the page with ?tune) */
.tune{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:60;max-width:440px;margin:0 auto;
  background:rgba(30,29,26,.92);color:#eeeadf;border-radius:14px;padding:10px 12px 12px;font:13px/1.3 var(--f-label);
  box-shadow:0 8px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:manipulation}
.tune.min .tune-body{display:none}
.tune-top{display:flex;align-items:center;gap:8px}
.tune-top strong{flex:1;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.tune button{font:inherit;color:inherit;background:rgba(255,255,255,.1);border:0;border-radius:8px;padding:7px 10px;cursor:pointer}
.tune button:active{background:rgba(255,255,255,.22)}
.tune-body{display:grid;grid-template-columns:auto 1fr 3.4em;gap:6px 8px;align-items:center;margin-top:8px;max-height:46vh;overflow:auto}
.tune-body label{white-space:nowrap;opacity:.85}
.tune-body input[type=range]{width:100%;accent-color:#eeeadf}
.tune-body output{text-align:right;font-variant-numeric:tabular-nums}
.tune-body .sep{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.15);margin:4px 0}
.tune-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tune-msg{grid-column:1/-1;opacity:.75;font-size:12px;min-height:1.2em}
.lede{margin:0;font-style:italic;font-size:19px;line-height:1.5;text-wrap:pretty}
.h2{display:flex;align-items:center;gap:10px;margin:0}
.h2::after{content:"";flex:1;border-top:1px solid var(--rule)}
.stories{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.story{border-top:1px solid var(--rule)}
.story:first-child{border-top:0}
.story summary{list-style:none;cursor:pointer;padding-block:14px;display:flex;flex-direction:column;gap:5px}
.story summary::-webkit-details-marker{display:none}
.kick{display:flex;flex-wrap:wrap;gap:4px 10px}
.kick .top{color:var(--ink);font-weight:600}
.hl{margin:0;font-weight:600;font-size:20px;line-height:1.25;text-wrap:balance}
.story.lead .hl{font-size:clamp(23px,5.6vw,28px);font-weight:700;line-height:1.18}
.why{margin:0;color:var(--ink-2);font-size:16px}
.byline{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-label);font-size:13px;color:var(--ink-2)}
.byline .more{white-space:nowrap}
details[open] .more .o, details:not([open]) .more .c{display:none}
.body{padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.body p{margin:0;max-width:65ch;text-wrap:pretty}
.body p:first-child::first-letter{font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-label);font-size:14px}
.watch{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.watch li{max-width:65ch}
.allsrc summary{cursor:pointer;list-style:none}
.allsrc summary::-webkit-details-marker{display:none}
.allsrc ol{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--ink-2)}
.allsrc li{overflow-wrap:anywhere}
.note{margin:0;font-size:14px;color:var(--ink-2);font-style:italic}
.hint{text-align:center;margin:0}
.empty{padding-block:48px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty p{margin:0;max-width:40ch;color:var(--ink-2)}
/* Read-aloud bar */
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.lbtn{background:none;border:1px solid var(--rule);border-radius:999px;padding:8px 14px;cursor:pointer;font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.lbtn:hover{background:var(--paper-2)}
.lbtn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lbtn.primary:hover{opacity:.9;background:var(--ink)}
.ltime{margin-left:2px}
.story.reading{background:var(--paper-2);margin-inline:-10px;padding-inline:10px;border-radius:6px}
.story.reading .hl::before{content:"♪ ";font-weight:400;color:var(--ink-2)}
footer{margin-top:40px;padding-top:10px;border-top:1px solid var(--rule);text-align:center}
</style>
</head>
<body>
<div class="paper">
  <div class="dateline">
    <button class="nav" id="older" type="button" aria-label="Older edition" disabled>‹ Older</button>
    <div class="when" id="when" aria-live="polite">Vertical News</div>
    <button class="nav" id="newer" type="button" aria-label="Newer edition" disabled>Newer ›</button>
  </div>
  <header class="mast">
    <h1 class="nameplate">vertical news</h1>
    <div class="sub label" id="sub">AI, bearing and automotive news, every morning</div>
  </header>
  <main id="edition">
    <div class="empty"><div class="label">Fetching editions</div></div>
  </main>
  <footer class="label">Vertical News · A new edition every morning</footer>
</div>

<script>
(function(){
  "use strict";
  var CAT={gen:"AI",ux:"Product & UX",pm:"Strategy & PM",eng:"Engineering AI",bear:"Bearings",auto:"Automotive"};
  var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
  var dates=[], idx=-1, cache={}, busy=false;
  var main=document.getElementById("edition"), when=document.getElementById("when"), sub=document.getElementById("sub");
  var olderBtn=document.getElementById("older"), newerBtn=document.getElementById("newer");

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e;}
  function str(v){return typeof v==="string"?v:"";}
  function arr(v){return Array.isArray(v)?v:[];}
  function safeUrl(u){return typeof u==="string"&&/^https?:\/\//i.test(u)?u:null;}
  function link(l){var u=safeUrl(l&&l.url);if(!u)return null;var a=el("a",null,str(l.label)||u);a.href=u;a.target="_blank";a.rel="noopener";return a;}
  function longDate(id){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(id);if(!m)return id;var d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return DAY[d.getUTCDay()]+" "+(+m[3])+" "+MON[+m[2]-1]+" "+m[1];}
  function showState(label,text){main.textContent="";var s=el("div","empty");s.appendChild(el("div","label",label));if(text)s.appendChild(el("p",null,text));main.appendChild(s);}

  function getJSON(url){
    return fetch(url,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});
  }
  function loadEdition(id){
    if(cache[id])return Promise.resolve(cache[id]);
    return getJSON("editions/"+id+".json").then(function(x){cache[id]=x||{};return cache[id];});
  }

  function storyEl(s,lead){
    var li=el("li","story"+(lead?" lead":""));
    var d=el("details"),sm=el("summary");
    var k=el("div","kick label");
    if(s.top)k.appendChild(el("span","top","Top story"));
    if(CAT[s.cat])k.appendChild(el("span",null,CAT[s.cat]));
    if(str(s.date))k.appendChild(el("span",null,s.date));
    sm.appendChild(k);
    sm.appendChild(el("h3","hl",str(s.headline)));
    if(str(s.why))sm.appendChild(el("p","why",s.why));
    var by=el("div","byline");by.appendChild(el("span",null,str(s.source)));
    var more=el("span","more");more.appendChild(el("span","o","Read ▾"));more.appendChild(el("span","c","Close ▴"));by.appendChild(more);
    sm.appendChild(by);d.appendChild(sm);
    var b=el("div","body");
    arr(s.body).forEach(function(p){if(str(p))b.appendChild(el("p",null,p));});
    var ls=arr(s.links).map(link).filter(Boolean);
    if(ls.length){var lw=el("div","links");ls.forEach(function(a){lw.appendChild(a);});b.appendChild(lw);}
    d.appendChild(b);li.appendChild(d);return li;
  }

  function build(id,x,at){
    var wrap=el("div","edition");
    var stories=arr(x.stories).filter(function(s){return s&&typeof s==="object";});
    stories.sort(function(a,b){return (b.top?1:0)-(a.top?1:0);});
    var bar=listenBar(id,x,stories);if(bar)wrap.appendChild(bar);
    if(str(x.glance))wrap.appendChild(el("p","lede",x.glance));
    if(stories.length){
      var sec=el("section");sec.appendChild(el("h2","h2 label","Stories"));
      var ol=el("ol","stories");
      stories.forEach(function(s){ol.appendChild(storyEl(s,!!s.top));});
      sec.appendChild(ol);wrap.appendChild(sec);
    }
    var w=arr(x.watch).filter(Boolean);
    if(w.length){var ws=el("section");ws.appendChild(el("h2","h2 label","Worth watching"));var ul=el("ul","watch");
      w.forEach(function(it){var li=el("li");if(str(it.title)){li.appendChild(el("strong",null,it.title+"."));li.appendChild(document.createTextNode(" "));}
        li.appendChild(document.createTextNode(str(it.text)+" "));var a=link(it.link);if(a)li.appendChild(a);ul.appendChild(li);});
      ws.appendChild(ul);wrap.appendChild(ws);}
    var src=arr(x.sources).map(link).filter(Boolean);
    if(src.length){var sd=el("details","allsrc");sd.appendChild(el("summary","h2 label","All sources ("+src.length+") ▾"));var so=el("ol");src.forEach(function(a){var li=el("li");li.appendChild(a);so.appendChild(li);});sd.appendChild(so);wrap.appendChild(sd);}
    if(str(x.note))wrap.appendChild(el("p","note",x.note));
    if(dates.length>1){
      var o=at>0, n=at<dates.length-1;
      wrap.appendChild(el("p","hint label","Swipe for "+(o?"older":"")+(o&&n?" or ":"")+(n?"newer":"")+" editions"));
    }
    return wrap;
  }

  /* ---------- Read aloud (browser speech synthesis; nothing leaves the device) ---------- */
  var synth=window.speechSynthesis, canSpeak=!!(synth&&window.SpeechSynthesisUtterance);
  var voice=null;
  function pickVoice(){
    if(!canSpeak)return;
    var vs=synth.getVoices().filter(function(v){return /^en[-_]/i.test(v.lang)||v.lang==="en";});
    if(!vs.length)return;
    function score(v){var s=0,n=v.name;
      if(/premium|enhanced|neural|natural/i.test(n))s+=8;
      if(/^en[-_]GB/i.test(v.lang))s+=3;else if(/^en[-_]US/i.test(v.lang))s+=2;
      if(/daniel|serena|kate|arthur|samantha|ava|google uk english|google us english/i.test(n))s+=2;
      if(/novelty|whisper|bells|bubbles|cellos|zarvox|trinoids|albert|bad news|good news|jester|organ|superstar|wobble|boing|deranged|hysterical/i.test(n))s-=20;
      if(v.localService)s+=1;return s;}
    vs.sort(function(a,b){return score(b)-score(a);});voice=vs[0];
  }
  if(canSpeak){pickVoice();if("onvoiceschanged" in synth)synth.onvoiceschanged=pickVoice;}

  var P={items:[],i:0,state:"idle",token:0,ui:null,storyAt:-1};
  function sayable(t){return str(t).replace(/(\d)\s*[–-]\s*(\d)/g,"$1 to $2").replace(/\s·\s/g,", ").replace(/[–—]/g,", ").replace(/\s+/g," ").trim();}
  function chunks(t){
    // Split only at sentence ends (punctuation, then a space, then a new sentence) so "$1.25T" or "e.g. Volvo" stay whole.
    var parts=sayable(t).replace(/([.!?]["'’”)\]]*)\s+(?=[A-Z0-9“"‘(])/g,"$1\u0001").split("\u0001");
    var out=[],cur="";
    parts.forEach(function(p){p=p.trim();if(!p)return;if(cur&&(cur+" "+p).length>220){out.push(cur);cur=p;}else cur=cur?cur+" "+p:p;});
    if(cur)out.push(cur);return out;
  }
  function script(id,x,stories){
    var items=[];
    function add(text,story){chunks(text).forEach(function(c){items.push({text:c,story:story});});}
    add("Vertical News. "+longDate(id)+".",-1);
    if(str(x.glance))add(x.glance,-1);
    stories.forEach(function(s,k){
      var t=(s.top?"Top story. ":"Story "+(k+1)+" of "+stories.length+". ")+str(s.headline).replace(/[.!?]?$/,".")+" "+str(s.why);
      add(t,k);
      arr(s.body).forEach(function(p){if(str(p))add(p,k);});
    });
    var w=arr(x.watch).filter(Boolean);
    if(w.length){add("Worth watching.",-2);w.forEach(function(it){add(str(it.title).replace(/[.!?]?$/,".")+" "+str(it.text),-2);});}
    add("That's the edition. Thanks for listening.",-2);
    return items;
  }
  function minutes(items){var words=items.reduce(function(n,it){return n+it.text.split(" ").length;},0);return Math.max(1,Math.round(words/160));}

  function highlight(k){
    if(k===P.storyAt)return;P.storyAt=k;
    var list=main.querySelectorAll(".story");
    list.forEach(function(n,j){n.classList.toggle("reading",j===k);});
    if(k>=0&&list[k]){var r=list[k].getBoundingClientRect();if(r.top<0||r.top>window.innerHeight*0.6)list[k].scrollIntoView({block:"start",behavior:"smooth"});}
  }
  function updateUI(){
    var u=P.ui;if(!u)return;
    u.play.textContent=P.state==="playing"?"❚❚ Pause":P.state==="paused"?"▶ Resume":"▶ Listen";
    u.play.setAttribute("aria-label",P.state==="playing"?"Pause reading":P.state==="paused"?"Resume reading":"Listen to this edition");
    u.next.hidden=u.stop.hidden=P.state==="idle";
    u.time.hidden=P.state!=="idle";
  }
  function speakFrom(i){
    var t=++P.token;synth.cancel();
    if(i>=P.items.length){finish();return;}
    P.i=i;P.state="playing";updateUI();
    var it=P.items[i];highlight(it.story);
    var u=new SpeechSynthesisUtterance(it.text);
    if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang="en-GB";
    u.rate=1;u.pitch=1;
    u.onend=function(){if(t===P.token)speakFrom(P.i+1);};
    u.onerror=function(e){if(t!==P.token)return;if(e&&(e.error==="interrupted"||e.error==="canceled"))return;speakFrom(P.i+1);};
    synth.speak(u);
  }
  function finish(){P.token++;P.state="idle";P.i=0;highlight(-1);updateUI();}
  function stopReading(){if(!canSpeak)return;P.token++;synth.cancel();finish();}
  function nextStory(){
    var cur=P.items[P.i]?P.items[P.i].story:-1;
    for(var j=P.i+1;j<P.items.length;j++){var s=P.items[j].story;if(s!==cur&&(s>=0||s===-2)&&(j===0||P.items[j-1].story!==s)){speakFrom(j);return;}}
    stopReading();
  }
  // Each edition's bar keeps its own script; it only takes over the player when its Listen button is pressed,
  // so a page built for a turn that gets cancelled never disturbs what is playing.
  function listenBar(id,x,stories){
    if(!canSpeak)return null;
    var items=script(id,x,stories);
    var bar=el("div","listen");
    var play=el("button","lbtn primary","▶ Listen");play.type="button";play.setAttribute("aria-label","Listen to this edition");
    var next=el("button","lbtn","Next ›");next.type="button";next.setAttribute("aria-label","Skip to next story");next.hidden=true;
    var stop=el("button","lbtn","Stop");stop.type="button";stop.hidden=true;
    var time=el("span","label ltime","About "+minutes(items)+" min");
    bar.appendChild(play);bar.appendChild(next);bar.appendChild(stop);bar.appendChild(time);
    var ui={play:play,next:next,stop:stop,time:time};
    play.addEventListener("click",function(){
      if(P.ui!==ui){stopReading();P.items=items;P.i=0;P.ui=ui;P.storyAt=-1;}
      if(P.state==="playing"){P.token++;synth.cancel();P.state="paused";updateUI();}
      else speakFrom(P.i);
    });
    next.addEventListener("click",function(){if(P.ui===ui)nextStory();});
    stop.addEventListener("click",function(){if(P.ui===ui)stopReading();});
    return bar;
  }
  function releasePlayer(){stopReading();P.ui=null;P.items=[];P.storyAt=-1;}
  window.addEventListener("pagehide",function(){if(canSpeak)synth.cancel();});

  /* ---------- Showing an edition ---------- */
  function header(i,x){
    when.textContent=longDate(dates[i]);
    sub.textContent=(str(x.covers)?"Covers "+x.covers+" · ":"")+"Edition "+(i+1)+" of "+dates.length;
    olderBtn.disabled=i<=0;newerBtn.disabled=i>=dates.length-1;
  }
  function mount(i,wrap,x){idx=i;main.textContent="";main.appendChild(wrap);header(i,x);}
  function settled(){
    try{history.replaceState(null,"","#"+dates[idx]);}catch(_){}
    // Warm the neighbours so the next turn can start the instant a finger moves.
    if(dates[idx-1])loadEdition(dates[idx-1]).catch(function(){});
    if(dates[idx+1])loadEdition(dates[idx+1]).catch(function(){});
  }
  function showNow(i){
    var id=dates[i];busy=true;
    loadEdition(id).then(function(x){releasePlayer();mount(i,build(id,x,i),x);window.scrollTo(0,0);busy=false;settled();})
    .catch(function(){busy=false;idx=i;when.textContent=longDate(id);sub.textContent="Edition "+(i+1)+" of "+dates.length;
      olderBtn.disabled=i<=0;newerBtn.disabled=i>=dates.length-1;
      showState("Edition unavailable","This edition could not be loaded. Reload the page to try again.");});
  }

  /* ---------- Page turn ----------
     dir +1 turns forward to a newer day (the sheet hinges on the left edge, like turning a page in a book);
     dir -1 turns back to an older day (hinges on the right edge).
     The sheet is a chain of vertical strips; each strip is rotated a little more than the one before it,
     so the page curls with its free edge leading, and each strip is lit according to its own angle. */
  var REDUCE=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DEFAULTS={duration:370,curl:49,roll:86,strips:24,shadow:1,shading:1,gloss:0.21,lift:92,persp:1300,threshold:0.34};
  var CFG={};
  (function(){var saved={};try{saved=JSON.parse(localStorage.getItem("vn-turn")||"{}")||{};}catch(_){}
    for(var k in DEFAULTS)CFG[k]=typeof saved[k]==="number"?saved[k]:DEFAULTS[k];})();
  function saveCfg(){try{localStorage.setItem("vn-turn",JSON.stringify(CFG));}catch(_){}}

  var turn=null;
  function beginTurn(target,dir){
    if(turn||busy||target<0||target>=dates.length||target===idx)return null;
    var x=cache[dates[target]];if(!x)return null;
    var prev={i:idx,wrap:main.firstElementChild,x:cache[dates[idx]],y:window.scrollY};
    releasePlayer();
    // 1. Photograph the page as it looks now, and cut the photo into strips that float above everything.
    var paper=document.querySelector(".paper"),r=paper.getBoundingClientRect();
    var W=window.innerWidth,N=Math.max(1,Math.round(CFG.strips)),sw=W/N,fwd=dir>0;
    var stage=el("div","flip-stage "+(fwd?"fwd":"back")),under=el("div","flip-under");
    stage.style.perspective=CFG.persp+"px";
    stage.setAttribute("aria-hidden","true");stage.appendChild(under);
    var proto=paper.cloneNode(true);proto.classList.add("flip-clone");
    proto.querySelectorAll("[id]").forEach(function(n){n.removeAttribute("id");});
    proto.style.top=r.top+"px";proto.style.width=r.width+"px";
    var strips=[],parent=stage;
    for(var k=0;k<N;k++){
      var s=el("div","flip-strip");s.style.width=sw+"px";
      // Strip k covers [k*sw,(k+1)*sw] measured from the hinge; children sit just beyond their parent's free edge.
      if(k===0){s.style.left=(fwd?0:W-sw)+"px";}else{s.style.left=(fwd?sw:-sw)+"px";}
      s.style.transformOrigin=fwd?"left center":"right center";
      var front=el("div","flip-face"),back=el("div","flip-face flip-back");
      var c=proto.cloneNode(true),stripX=fwd?k*sw:W-(k+1)*sw;
      c.style.left=(r.left-stripX)+"px";
      var fs=el("div","flip-shade"),fg=el("div","flip-gloss"),bs=el("div","flip-shade");
      front.appendChild(c);front.appendChild(fs);front.appendChild(fg);back.appendChild(bs);
      s.appendChild(front);s.appendChild(back);parent.appendChild(s);
      strips.push({el:s,fs:fs,fg:fg,bs:bs});parent=s;
    }
    // Curl weights grow towards the free edge, so the bend gathers near the edge the finger is lifting.
    var wts=[],wsum=0;for(k=0;k<N;k++){var wk=Math.pow((k+1)/N,2);wts.push(wk);wsum+=wk;}
    document.body.appendChild(stage);
    // 2. Underneath, the real page becomes the new day, opened at the top. The old edition stays in the document
    //    (hidden) until the turn ends: the finger's touch events belong to it, and removing it would stop them arriving.
    var nextWrap=build(dates[target],x,target);
    if(prev.wrap)prev.wrap.style.display="none";
    main.appendChild(nextWrap);idx=target;header(target,x);
    window.scrollTo(0,0);
    var p=0,raf=0,sg=fwd?-1:1;
    function set(v){
      p=Math.max(0,Math.min(1,v));
      var bend=Math.sin(p*Math.PI),A=sg*180*p,curl=sg*CFG.curl*bend,abs=0;
      // Roll: an even, cylinder-like curve across the whole sheet, like newsprint that has been rolled.
      // It eases in as soon as the sheet lifts and flattens again as it lands, so nothing jumps at either end.
      var roll=sg*CFG.roll*Math.min(1,p*5)*Math.min(1,(1-p)*5)/N;
      // The side by the hinge lags while the far side peels up: hold the hinge back by part of the bend,
      // so the middle of the sheet tracks the turn and the page stays on screen longer.
      var extra=Math.abs(curl)+Math.abs(roll)*(N-1),base=sg*Math.max(0,Math.abs(A)-0.6*extra);
      for(var k=0;k<N;k++){
        var rel=(k===0?base:0)+curl*wts[k]/wsum+(k===0?0:roll);abs+=rel;
        var t=strips[k];
        t.el.style.transform=(k===0?"translateZ("+(CFG.lift*bend).toFixed(1)+"px) ":"")+"rotateY("+rel.toFixed(2)+"deg)";
        var cs=Math.cos(abs*Math.PI/180);
        // Front darkens as it turns away from the light; the back is darkest edge-on and lightens as it lies flat.
        t.fs.style.opacity=(CFG.shading*Math.max(0,1-cs)*0.9).toFixed(3);
        t.bs.style.opacity=(CFG.shading*Math.max(0,1+cs)*0.6).toFixed(3);
        var a=Math.abs(abs);t.fg.style.opacity=(CFG.gloss*Math.exp(-Math.pow((a-45)/22,2))).toFixed(3);
      }
      under.style.opacity=(CFG.shadow*Math.min(1,(1-p)*1.6)*(p>0.002?1:0)).toFixed(3);
    }
    function done(ok){
      cancelAnimationFrame(raf);
      if(ok){if(prev.wrap&&prev.wrap!==nextWrap)prev.wrap.remove();}
      else{nextWrap.remove();if(prev.wrap)prev.wrap.style.display="";idx=prev.i;header(prev.i,prev.x);window.scrollTo(0,prev.y);}
      stage.remove();turn=null;
      if(ok)settled();
      if(tuneSync)tuneSync();
    }
    function animate(to,ms,ease,cb){
      cancelAnimationFrame(raf);
      var from=p,t0=performance.now();
      if(REDUCE||ms<=0){set(to);cb();return;}
      (function step(now){
        var k=Math.min(1,(now-t0)/ms);set(from+(to-from)*ease(k));
        if(k<1)raf=requestAnimationFrame(step);else cb();
      })(t0);
    }
    function easeInOut(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;}
    function easeOut(k){return 1-Math.pow(1-k,3);}
    set(0);
    turn={
      dir:dir,
      set:function(v){cancelAnimationFrame(raf);set(v);},
      progress:function(){return p;},
      play:function(){animate(1,CFG.duration*(1-p),easeInOut,function(){done(true);});},
      release:function(commit){
        if(commit)animate(1,Math.max(220,CFG.duration*0.65*(1-p)),easeOut,function(){done(true);});
        else animate(0,Math.max(180,CFG.duration*0.5*p),easeOut,function(){done(false);});
      }
    };
    return turn;
  }

  /* ---------- Tuning panel: open the page with ?tune ---------- */
  var tuneSync=null;
  (function(){
    if(!/[?&]tune\b/.test(location.search))return;
    var SL=[["duration","Speed (ms)",300,2000,10],["curl","Curl at edge (°)",0,120,1],["roll","Roll (°)",0,120,1],["strips","Smoothness",1,24,1],
      ["shadow","Shadow on page",0,1,.01],["shading","Shading on sheet",0,1,.01],["gloss","Gloss",0,1,.01],
      ["lift","Lift (px)",0,120,1],["persp","Depth (px)",500,4000,50],["threshold","Swipe distance",.1,.8,.01]];
    var box=el("div","tune"),top=el("div","tune-top"),body=el("div","tune-body");
    top.appendChild(el("strong",null,"Page turn"));
    var hideBtn=el("button",null,"Hide");hideBtn.type="button";top.appendChild(hideBtn);
    hideBtn.addEventListener("click",function(){box.classList.toggle("min");hideBtn.textContent=box.classList.contains("min")?"Show":"Hide";});
    box.appendChild(top);box.appendChild(body);
    var inputs={};
    SL.forEach(function(d){
      var lab=el("label",null,d[1]),inp=el("input"),out=el("output");
      inp.type="range";inp.min=d[2];inp.max=d[3];inp.step=d[4];inp.value=CFG[d[0]];out.textContent=CFG[d[0]];
      lab.htmlFor=inp.id="tune-"+d[0];
      inp.addEventListener("input",function(){CFG[d[0]]=+inp.value;out.textContent=inp.value;saveCfg();if(turn&&d[0]!=="strips"&&d[0]!=="persp")turn.set(turn.progress());});
      body.appendChild(lab);body.appendChild(inp);body.appendChild(out);inputs[d[0]]={inp:inp,out:out};
    });
    body.appendChild(el("div","sep"));
    // Scrub: holds a turn at any point so the look can be judged frame by frame.
    var sl=el("label",null,"Hold turn at"),scrub=el("input"),so=el("output","","0");
    scrub.type="range";scrub.min=0;scrub.max=1;scrub.step=.005;scrub.value=0;sl.htmlFor=scrub.id="tune-scrub";
    body.appendChild(sl);body.appendChild(scrub);body.appendChild(so);
    function neighbour(){return idx<dates.length-1?1:-1;}
    function ensureTurn(){
      if(turn)return turn;
      var t=idx+neighbour();
      if(!cache[dates[t]]){loadEdition(dates[t]).catch(function(){});msg.textContent="Loading the next edition, try again in a moment";return null;}
      return beginTurn(t,neighbour());
    }
    scrub.addEventListener("input",function(){var t=ensureTurn();if(t){t.set(+scrub.value);so.textContent=(+scrub.value).toFixed(2);}});
    var acts=el("div","tune-actions");
    function btn(label,fn){var b=el("button",null,label);b.type="button";b.addEventListener("click",fn);acts.appendChild(b);return b;}
    btn("▶ Play turn",function(){if(turn){turn.play();return;}var t=ensureTurn();if(t)t.play();});
    btn("Let go",function(){if(turn)turn.release(turn.progress()>CFG.threshold);});
    btn("Reset",function(){for(var k in DEFAULTS){CFG[k]=DEFAULTS[k];inputs[k].inp.value=CFG[k];inputs[k].out.textContent=CFG[k];}saveCfg();if(turn)turn.set(turn.progress());msg.textContent="Back to defaults";});
    btn("Copy settings",function(){
      var txt=JSON.stringify(CFG);
      var ok=function(){msg.textContent="Copied: "+txt;},bad=function(){msg.textContent=txt;};
      try{navigator.clipboard.writeText(txt).then(ok,bad);}catch(_){bad();}
    });
    body.appendChild(acts);
    var msg=el("div","tune-msg","Curl, shading and gloss update live while a turn is held. Smoothness and depth apply to the next turn.");
    body.appendChild(msg);
    document.body.appendChild(box);
    tuneSync=function(){scrub.value=0;so.textContent="0";};
  })();

  function goTo(target){
    if(turn||busy||target<0||target>=dates.length||target===idx)return;
    var dir=target>idx?1:-1;
    var start=function(){var t=beginTurn(target,dir);if(t)t.play();else showNow(target);};
    if(cache[dates[target]])start();
    else{busy=true;loadEdition(dates[target]).then(function(){busy=false;start();},function(){busy=false;showNow(target);});}
  }
  function go(step){goTo(idx+step);}
  olderBtn.addEventListener("click",function(){go(-1);});
  newerBtn.addEventListener("click",function(){go(1);});
  document.addEventListener("keydown",function(e){if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")go(1);});
  window.addEventListener("hashchange",function(){var h=dates.indexOf(location.hash.slice(1));if(h>=0&&h!==idx)goTo(h);});

  /* Finger-driven turn: once a swipe is clearly sideways the sheet follows the finger;
     letting go past about a third of the screen (or with a quick flick) completes the turn, otherwise it falls back.
     Finger moving left turns forward to the newer day, moving right turns back to the older one. */
  var g=null;
  document.addEventListener("touchstart",function(e){
    if(turn||busy||e.touches.length!==1||(e.target.closest&&e.target.closest(".tune"))){g=null;return;}
    var t=e.touches[0];g={x:t.clientX,y:t.clientY,mode:"?",lx:t.clientX,lt:performance.now(),v:0};
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(!g||e.touches.length!==1)return;
    var t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y,now=performance.now();
    if(g.mode==="?"){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      if(Math.abs(dx)>Math.abs(dy)*1.2){
        var dir=dx<0?1:-1,target=idx+dir;
        g.mode=(target>=0&&target<dates.length&&cache[dates[target]]&&beginTurn(target,dir))?"turn":"edge";
        if(g.mode==="edge"&&dates[target]&&!cache[dates[target]])loadEdition(dates[target]).catch(function(){});
      }else g.mode="scroll";
    }
    if(g.mode==="scroll")return;
    if(e.cancelable)e.preventDefault();
    if(g.mode==="turn"&&turn){
      var w=window.innerWidth*0.85;
      turn.set((turn.dir>0?-dx:dx)/w);
      var dt=now-g.lt;if(dt>0){g.v=(t.clientX-g.lx)/dt;g.lx=t.clientX;g.lt=now;}
    }
  },{passive:false});
  function endGesture(cancelled){
    if(!g)return;var m=g.mode,v=g.v;g=null;
    if(m!=="turn"||!turn)return;
    var p=turn.progress(),flick=(turn.dir>0?-v:v);
    turn.release(!cancelled&&(p>CFG.threshold||(flick>0.45&&p>0.04)));
  }
  document.addEventListener("touchend",function(){endGesture(false);},{passive:true});
  document.addEventListener("touchcancel",function(){endGesture(true);},{passive:true});

  getJSON("editions/index.json").then(function(ix){
    var seen={};
    dates=arr(ix&&ix.editions).filter(function(d){if(typeof d!=="string"||!DATE_RE.test(d)||seen[d])return false;seen[d]=1;return true;}).sort();
    if(!dates.length){showState("No editions yet","The first edition arrives with the next morning run.");return;}
    var h=dates.indexOf((location.hash||"").slice(1));
    showNow(h>=0?h:dates.length-1);
  }).catch(function(){
    showState("Editions unavailable","The editions could not be loaded right now. Reload the page to try again.");
  });
})();
</script>
</body>
</html>
