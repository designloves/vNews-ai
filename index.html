<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vertical News</title>
<meta name="description" content="A daily brief of AI, bearing and automotive news for people who build digital products and vehicles.">
<meta property="og:title" content="Vertical News">
<meta property="og:description" content="A daily brief of AI, bearing and automotive news.">
<meta name="theme-color" content="#eeeadf" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/favicon-32.png?v=3" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="apple-mobile-web-app-title" content="Vertical News">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Archivo+Narrow:wght@500;600&family=UnifrakturMaguntia&display=swap">
<style>
/* One newspaper front page per day: dated masthead, single reading column. Arrows, keys or swipe turn to older/newer editions. */
:root{
  --paper:#eeeadf; --paper-2:#e5e0d3; --ink:#2f2d28; --ink-2:#625e55; --rule:#cdc6b6; --link:#3f5a70;
  --f-serif:"Newsreader","Iowan Old Style",Georgia,"Times New Roman",serif;
  --f-label:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#1f1e1b; --paper-2:#292824; --ink:#d6d1c4; --ink-2:#9b958a; --rule:#3b3933; --link:#a3b8c8; color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-serif);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}
.paper{max-width:680px;margin:0 auto}
.label{font-family:var(--f-label);font-weight:500;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}

/* Masthead */
.dateline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:6px;border-bottom:1px solid var(--rule)}
.dateline .when{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-align:center;flex:1;min-width:0}
.nav{background:none;border:1px solid transparent;border-radius:6px;padding:8px 8px;cursor:pointer;font-family:var(--f-label);font-size:13px;letter-spacing:.04em;color:var(--ink-2);white-space:nowrap}
.nav:hover:not(:disabled){background:var(--paper-2);color:var(--ink)}
.nav:disabled{opacity:.35;cursor:default}
.mast{text-align:center;padding-block:14px 6px}
/* Compact nameplate that stays pinned once the masthead has scrolled away */
:root{--bar:0px}
.minibar{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--paper);padding-top:env(safe-area-inset-top,0px);text-align:center;
  transform:translateY(-100%);transition:transform .22s ease,box-shadow .22s ease;pointer-events:none}
.minibar.on{transform:none;pointer-events:auto;box-shadow:0 8px 16px -12px rgba(0,0,0,.45)}
.minibar button{display:block;width:100%;background:none;border:0;padding:8px 16px 9px;cursor:pointer;color:var(--ink);
  font-family:"UnifrakturMaguntia","Old English Text MT",var(--f-serif);font-size:34px;line-height:1}
@media (prefers-reduced-motion: reduce){.minibar{transition:none}}
.nameplate{margin:0;font-family:"UnifrakturMaguntia","Old English Text MT",var(--f-serif);font-weight:400;font-size:clamp(38px,10.5vw,72px);line-height:1}
.mast .sub{margin-top:8px}

/* Edition */
#edition{touch-action:pan-y;min-height:50vh}
.edition{display:flex;flex-direction:column;gap:44px;padding-top:22px}
/* Page turn: a snapshot of the visible page is cut into vertical strips chained in 3D, so the sheet curls as it
   turns around the screen edge; the real, already-updated page waits underneath. */
.flip-stage{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.flip-under{position:absolute;inset:0;opacity:0}
.flip-stage.fwd .flip-under{background:linear-gradient(to left,rgba(0,0,0,.55),rgba(0,0,0,.22) 45%,rgba(0,0,0,.05))}
.flip-stage.back .flip-under{background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,.22) 45%,rgba(0,0,0,.05))}
.flip-strip{position:absolute;top:0;height:100%;transform-style:preserve-3d}
.flip-face{position:absolute;top:0;height:100%;width:calc(100% + 1.5px);overflow:hidden;background:var(--paper);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.flip-stage.back .flip-face{right:0}
.flip-back{transform:rotateY(180deg);background:var(--paper-2)}
.flip-shade,.flip-gloss{position:absolute;inset:0;opacity:0}
.flip-shade{background:#000}
.flip-gloss{background:#fff;mix-blend-mode:soft-light}
.flip-clone{position:absolute;margin:0}

/* Live tuning panel (open the page with ?tune) */
.tune{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:60;max-width:440px;margin:0 auto;
  background:rgba(30,29,26,.92);color:#eeeadf;border-radius:14px;padding:10px 12px 12px;font:13px/1.3 var(--f-label);
  box-shadow:0 8px 30px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:manipulation}
.tune.min .tune-body{display:none}
.tune-top{display:flex;align-items:center;gap:8px}
.tune-top strong{flex:1;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.tune button{font:inherit;color:inherit;background:rgba(255,255,255,.1);border:0;border-radius:8px;padding:7px 10px;cursor:pointer}
.tune button:active{background:rgba(255,255,255,.22)}
.tune-body{display:grid;grid-template-columns:auto 1fr 3.4em;gap:6px 8px;align-items:center;margin-top:8px;max-height:46vh;overflow:auto}
.tune-body label{white-space:nowrap;opacity:.85}
.tune-body input[type=range]{width:100%;accent-color:#eeeadf}
.tune-body output{text-align:right;font-variant-numeric:tabular-nums}
.tune-body .sep{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.15);margin:4px 0}
.tune-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tune-msg{grid-column:1/-1;opacity:.75;font-size:12px;min-height:1.2em}
.lede{margin:0;font-style:italic;font-size:19px;line-height:1.5;text-wrap:pretty}
.h2{display:flex;align-items:center;gap:10px;margin:0}
.h2::after{content:"";flex:1;border-top:1px solid var(--rule)}
.stories{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.story{border-top:1px solid var(--rule)}
.story:first-child{border-top:0}
.story summary{list-style:none;cursor:pointer;padding-block:14px;display:flex;flex-direction:column;gap:5px}
.story summary::-webkit-details-marker{display:none}
.kick{display:flex;flex-wrap:wrap;gap:4px 10px}
.kick .top{color:var(--ink);font-weight:600}
.hl{margin:0;font-weight:600;font-size:20px;line-height:1.25;text-wrap:balance}
.story.lead .hl{font-size:clamp(23px,5.6vw,28px);font-weight:700;line-height:1.18}
.why{margin:0;color:var(--ink-2);font-size:16px}
.byline{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-label);font-size:13px;color:var(--ink-2)}
.byline .more{white-space:nowrap}
details[open] .more .o, details:not([open]) .more .c{display:none}
.body{padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.body p{margin:0;max-width:65ch;text-wrap:pretty}
.body p:first-child::first-letter{font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-label);font-size:14px}
.watch{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:14px}
.watch li{max-width:65ch}
.allsrc summary{cursor:pointer;list-style:none}
.allsrc summary::-webkit-details-marker{display:none}
.allsrc ol{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--ink-2)}
.allsrc li{overflow-wrap:anywhere}
.note{margin:0;font-size:14px;color:var(--ink-2);font-style:italic}
.hint{text-align:center;margin:0}
.empty{padding-block:48px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty p{margin:0;max-width:40ch;color:var(--ink-2)}
/* Read-aloud bar */
/* Floating Listen button */
.fab-wrap{position:fixed;z-index:40;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:12px;width:112px}
.fab{width:66px;height:66px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.2);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:transform .18s ease,box-shadow .18s ease}
.fab{-webkit-tap-highlight-color:transparent}
.fab:active{transform:scale(.92)}
.fab-wrap.dragging .fab{transform:scale(1.12);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.fab-mini{display:grid;width:50px;height:50px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.18);padding:0;-webkit-tap-highlight-color:transparent;
  transition:transform .12s ease,background .12s ease,box-shadow .12s ease}
.fab-mini:active:not(:disabled){transform:scale(.88);background:var(--paper-2);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.fab-mini .arr{transform-box:view-box;transform-origin:16px 17px}
.fab-mini.is-back.spin .arr{animation:spinBack .5s cubic-bezier(.3,.7,.3,1)}
.fab-mini.is-fwd.spin .arr{animation:spinFwd .5s cubic-bezier(.3,.7,.3,1)}
@keyframes spinBack{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
@keyframes spinFwd{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.fab-row{display:none;gap:12px;animation:fabIn .2s ease-out}
.fab-mini:disabled{opacity:.4;cursor:default}
.fab-wrap.playing .fab-row{display:flex}
@keyframes fabIn{from{transform:translateY(12px) scale(.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.fab-row,.fab-mini .arr{animation:none!important}.fab{transition:none}}
/* Section heads stay pinned while you read through their section */
.sec-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar));z-index:5;background:var(--paper)}
.sec-head::before{content:"";position:absolute;left:0;right:0;bottom:calc(100% + 3px);height:calc(env(safe-area-inset-top,0px) + var(--bar));background:var(--paper)}
/* Newspaper section heads: heavy rule, section name on the left, an optional control on the right */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 6px;padding-top:10px;
  border-top:3px solid var(--ink);padding-bottom:10px}
.sec-title{margin:0;font-family:var(--f-serif);font-weight:700;font-size:21px;line-height:1.2;color:var(--ink)}
.sec-meta{font-family:var(--f-label);font-size:14px;color:var(--ink-2)}
.sec-head.toggle{cursor:pointer}
.sec-btn{background:none;border:0;padding:4px 0 4px 12px;margin:-4px 0;cursor:pointer;font-family:var(--f-label);font-weight:600;font-size:14px;color:var(--ink)}
.sec-head .left{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-body{display:flex;flex-direction:column;gap:36px}
.sub-head{margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule);font-family:var(--f-serif);font-weight:700;font-size:18px;color:var(--ink)}
.allsrc summary{padding-block:4px}
footer{margin-top:40px;padding-top:10px;border-top:1px solid var(--rule);text-align:center}
</style>
</head>
<body>
<div class="paper">
  <div class="dateline">
    <button class="nav" id="older" type="button" aria-label="Older edition" disabled>‹ Older</button>
    <div class="when" id="when" aria-live="polite">Vertical News</div>
    <button class="nav" id="newer" type="button" aria-label="Newer edition" disabled>Newer ›</button>
  </div>
  <header class="mast">
    <h1 class="nameplate">vertical news</h1>
    <div class="sub label" id="sub">AI, bearing and automotive news, every morning</div>
  </header>
  <main id="edition">
    <div class="empty"><div class="label">Fetching editions</div></div>
  </main>
  <footer class="label">Vertical News · A new edition every morning</footer>
</div>

<script>
(function(){
  "use strict";
  var CAT={gen:"AI",ux:"Product & UX",pm:"Strategy & PM",eng:"Engineering AI",bear:"Bearings",auto:"Automotive"};
  var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DAY=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
  var dates=[], idx=-1, cache={}, busy=false;
  var main=document.getElementById("edition"), when=document.getElementById("when"), sub=document.getElementById("sub");
  var olderBtn=document.getElementById("older"), newerBtn=document.getElementById("newer");

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e;}
  function str(v){return typeof v==="string"?v:"";}
  function arr(v){return Array.isArray(v)?v:[];}
  function safeUrl(u){return typeof u==="string"&&/^https?:\/\//i.test(u)?u:null;}
  function link(l){var u=safeUrl(l&&l.url);if(!u)return null;var a=el("a",null,str(l.label)||u);a.href=u;a.target="_blank";a.rel="noopener";return a;}
  function longDate(id){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(id);if(!m)return id;var d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return DAY[d.getUTCDay()]+" "+(+m[3])+" "+MON[+m[2]-1]+" "+m[1];}
  function showState(label,text){main.textContent="";var s=el("div","empty");s.appendChild(el("div","label",label));if(text)s.appendChild(el("p",null,text));main.appendChild(s);}

  function getJSON(url){
    return fetch(url,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});
  }
  function loadEdition(id){
    if(cache[id])return Promise.resolve(cache[id]);
    return getJSON("editions/"+id+".json").then(function(x){cache[id]=x||{};return cache[id];});
  }

  function storyEl(s,lead){
    var li=el("li","story"+(lead?" lead":""));
    var d=el("details"),sm=el("summary");
    var k=el("div","kick label");
    if(CAT[s.cat])k.appendChild(el("span",null,CAT[s.cat]));
    if(str(s.date))k.appendChild(el("span",null,s.date));
    sm.appendChild(k);
    sm.appendChild(el("h3","hl",str(s.headline)));
    if(str(s.why))sm.appendChild(el("p","why",s.why));
    var by=el("div","byline");by.appendChild(el("span",null,str(s.source)));
    var more=el("span","more");more.appendChild(el("span","o","Read ▾"));more.appendChild(el("span","c","Close ▴"));by.appendChild(more);
    sm.appendChild(by);d.appendChild(sm);
    var b=el("div","body");
    arr(s.body).forEach(function(p){if(str(p))b.appendChild(el("p",null,p));});
    var ls=arr(s.links).map(link).filter(Boolean);
    if(ls.length){var lw=el("div","links");ls.forEach(function(a){lw.appendChild(a);});b.appendChild(lw);}
    d.appendChild(b);li.appendChild(d);return li;
  }

  function build(id,x,at){
    var wrap=el("div","edition");
    var stories=arr(x.stories).filter(function(s){return s&&typeof s==="object";});
    stories.sort(function(a,b){return (b.top?1:0)-(a.top?1:0);});
    // The written summary is not shown; it is what the Listen button reads (see script()).
    var tops=stories.filter(function(s){return s.top;}),rest=stories.filter(function(s){return !s.top;});
    if(!tops.length){tops=rest.slice(0,1);rest=rest.slice(1);}   // an edition with no top story still leads with one
    function secHead(title,meta){
      var h=el("div","sec-head"),l=el("div","left");l.appendChild(el("h2","sec-title",title));
      if(meta)l.appendChild(el("span","sec-meta",meta));h.appendChild(l);return h;
    }
    if(tops.length){
      var ts=el("section");ts.appendChild(secHead("Top stories"));
      var tol=el("ol","stories");tops.forEach(function(s){tol.appendChild(storyEl(s,true));});
      ts.appendChild(tol);wrap.appendChild(ts);
    }
    // All news: the remaining stories plus Worth watching, folded away behind the section head.
    var w=arr(x.watch).filter(Boolean);
    if(rest.length||w.length){
      var as=el("section","allnews");
      var meta=rest.length?rest.length+(rest.length===1?" story":" stories"):"";
      var hd=secHead("All news",meta);hd.classList.add("toggle");
      var tog=el("button","sec-btn","Show ▾");tog.type="button";tog.setAttribute("aria-expanded","false");
      hd.appendChild(tog);as.appendChild(hd);
      var body=el("div","sec-body");body.hidden=true;
      if(rest.length){var aol=el("ol","stories");rest.forEach(function(s){aol.appendChild(storyEl(s,false));});body.appendChild(aol);}
      if(w.length){var ws=el("div");ws.appendChild(el("h3","sub-head","Worth watching"));var ul=el("ul","watch");
        w.forEach(function(it){var li=el("li");if(str(it.title)){li.appendChild(el("strong",null,it.title+"."));li.appendChild(document.createTextNode(" "));}
          li.appendChild(document.createTextNode(str(it.text)+" "));var a=link(it.link);if(a)li.appendChild(a);ul.appendChild(li);});
        ws.appendChild(ul);body.appendChild(ws);}
      as.appendChild(body);wrap.appendChild(as);
      var flip=function(e){if(e&&e.target.closest&&e.target.closest("a"))return;var open=body.hidden;body.hidden=!open;
        tog.setAttribute("aria-expanded",String(open));tog.textContent=open?"Hide ▴":"Show ▾";};
      hd.addEventListener("click",flip);
    }
    var src=arr(x.sources).map(link).filter(Boolean);
    if(src.length){
      var sd=el("section","allsrc"),sh=secHead("Sources",src.length+(src.length===1?" link":" links"));sh.classList.add("toggle");
      var sb=el("button","sec-btn","Show ▾");sb.type="button";sb.setAttribute("aria-expanded","false");sh.appendChild(sb);
      var so=el("ol");so.hidden=true;src.forEach(function(a){var li=el("li");li.appendChild(a);so.appendChild(li);});
      sh.addEventListener("click",function(){var open=so.hidden;so.hidden=!open;sb.setAttribute("aria-expanded",String(open));sb.textContent=open?"Hide ▴":"Show ▾";});
      sd.appendChild(sh);sd.appendChild(so);wrap.appendChild(sd);
    }
    if(str(x.note))wrap.appendChild(el("p","note",x.note));
    if(dates.length>1){
      var o=at>0, n=at<dates.length-1;
      wrap.appendChild(el("p","hint label","Swipe for "+(o?"older":"")+(o&&n?" or ":"")+(n?"newer":"")+" editions"));
    }
    return wrap;
  }

  /* ---------- Read aloud (browser speech synthesis; nothing leaves the device) ---------- */
  var synth=window.speechSynthesis, canSpeak=!!(synth&&window.SpeechSynthesisUtterance);
  var voice=null;
  function pickVoice(){
    if(!canSpeak)return;
    var vs=synth.getVoices().filter(function(v){return /^en[-_]/i.test(v.lang)||v.lang==="en";});
    if(!vs.length)return;
    function score(v){var s=0,n=v.name;
      if(/premium|enhanced|neural|natural/i.test(n))s+=8;
      if(/^en[-_]GB/i.test(v.lang))s+=3;else if(/^en[-_]US/i.test(v.lang))s+=2;
      if(/daniel|serena|kate|arthur|samantha|ava|google uk english|google us english/i.test(n))s+=2;
      if(/novelty|whisper|bells|bubbles|cellos|zarvox|trinoids|albert|bad news|good news|jester|organ|superstar|wobble|boing|deranged|hysterical/i.test(n))s-=20;
      if(v.localService)s+=1;return s;}
    vs.sort(function(a,b){return score(b)-score(a);});voice=vs[0];
  }
  if(canSpeak){pickVoice();if("onvoiceschanged" in synth)synth.onvoiceschanged=pickVoice;}

  var P={items:[],i:0,state:"idle",token:0};
  function sayable(t){return str(t).replace(/(\d)\s*[–-]\s*(\d)/g,"$1 to $2").replace(/\s·\s/g,", ").replace(/[–—]/g,", ").replace(/\s+/g," ").trim();}
  function chunks(t){
    // Split only at sentence ends (punctuation, then a space, then a new sentence) so "$1.25T" or "e.g. Volvo" stay whole.
    var parts=sayable(t).replace(/([.!?]["'’”)\]]*)\s+(?=[A-Z0-9“"‘(])/g,"$1\u0001").split("\u0001");
    var out=[],cur="";
    parts.forEach(function(p){p=p.trim();if(!p)return;if(cur&&(cur+" "+p).length>220){out.push(cur);cur=p;}else cur=cur?cur+" "+p:p;});
    if(cur)out.push(cur);return out;
  }
  function script(id,x,stories){
    var items=[];
    function add(text,story){chunks(text).forEach(function(c){items.push({text:c,story:story});});}
    // Listen reads the spoken brief, a longer version of the summary written for the ear.
    // Older editions without one fall back to the short summary plus each headline.
    add("Vertical News. "+longDate(id)+".",-1);
    if(str(x.brief))add(x.brief,-1);
    else{
      if(str(x.glance))add(x.glance,-1);

    var t=e.touches[0],dx=t.clientX-g.x,dy=t.clientY-g.y,now=performance.now();
    if(g.mode==="?"){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      if(Math.abs(dx)>Math.abs(dy)*1.2){
        var dir=dx<0?1:-1,target=idx+dir;
        g.mode=(target>=0&&target<dates.length&&cache[dates[target]]&&beginTurn(target,dir))?"turn":"edge";
        if(g.mode==="edge"&&dates[target]&&!cache[dates[target]])loadEdition(dates[target]).catch(function(){});
      }else g.mode="scroll";
    }
    if(g.mode==="scroll")return;
    if(e.cancelable)e.preventDefault();
    if(g.mode==="turn"&&turn){
      var w=window.innerWidth*0.85;
      turn.set((turn.dir>0?-dx:dx)/w);
      var dt=now-g.lt;if(dt>0){g.v=(t.clientX-g.lx)/dt;g.lx=t.clientX;g.lt=now;}
    }
  },{passive:false});
  function endGesture(cancelled){
    if(!g)return;var m=g.mode,v=g.v;g=null;
    if(m!=="turn"||!turn)return;
    var p=turn.progress(),flick=(turn.dir>0?-v:v);
    turn.release(!cancelled&&(p>CFG.threshold||(flick>0.45&&p>0.04)));
  }
  document.addEventListener("touchend",function(){endGesture(false);},{passive:true});
  document.addEventListener("touchcancel",function(){endGesture(true);},{passive:true});

  getJSON("editions/index.json").then(function(ix){
    var seen={};
    dates=arr(ix&&ix.editions).filter(function(d){if(typeof d!=="string"||!DATE_RE.test(d)||seen[d])return false;seen[d]=1;return true;}).sort();
    if(!dates.length){showState("No editions yet","The first edition arrives with the next morning run.");return;}
    var h=dates.indexOf((location.hash||"").slice(1));
    showNow(h>=0?h:dates.length-1);
  }).catch(function(){
    showState("Editions unavailable","The editions could not be loaded right now. Reload the page to try again.");
  });
})();
</script>
</body>
</html>
