name: Record the spoken brief

# Whenever an edition is added or changed, record its brief as an MP3 with Kokoro and commit it.
# To change the voice, edit KOKORO_VOICE below (bf_emma, bf_isabella, bm_george, bm_fable); every edition is re-recorded.
on:
  push:
    branches: [main]
    paths:
      - "editions/*.json"
      - "tools/make_audio.py"
      - ".github/workflows/audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kokoro (CPU) and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "kokoro>=0.9.4" soundfile numpy

      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Record editions that need it
        env:
          KOKORO_VOICE: bf_emma
        run: python tools/make_audio.py

      - name: Commit the audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions/*.mp3 editions/audio.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Audio for new editions"
          for i in 1 2 3; do git pull --rebase --quiet origin main && git push && exit 0; sleep 5; done
          exit 1
